name: TIME PASS
on:
  workflow_dispatch:
    inputs:
      increment:
        type: string
        description: "Enter Your NGROK TOKEN"
        required: true
        default: ""
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: Download Ngrok.
        run: |
          Invoke-WebRequest https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip -OutFile ngrok.zip
      - name: Extract Ngrok File.
        run: Expand-Archive ngrok.zip
      - name: Connect Ngrok.
        run: |
          .\ngrok\ngrok.exe authtoken $Env:NGROK_AUTH
        env:
          NGROK_AUTH: ${{ github.event.inputs.increment }}
      - name: Windows10 RDP.
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1
      - name: Tunnel.
        run: |
          Start-Process -FilePath ".\ngrok\ngrok.exe" -ArgumentList "tcp --region us 3389" -NoNewWindow
          Start-Sleep -Seconds 3
          Get-Process ngrok -ErrorAction SilentlyContinue | Select-Object Id, ProcessName
      - name: Wait for Ngrok API and print tunnel URL + creds
        shell: powershell
        run: |
          $maxRetries = 30
          $tunnel = $null
          for ($i = 0; $i -lt $maxRetries; $i++) {
            try {
              $response = Invoke-WebRequest -Uri http://127.0.0.1:4040/api/tunnels -TimeoutSec 5 -ErrorAction Stop
              $data = $response.Content | ConvertFrom-Json
              $tunnel = $data.tunnels[0].public_url
              if ($tunnel) { break }
            } catch {
              Write-Host "Ngrok API not ready yet (attempt $($i + 1)/$maxRetries). Error: $($_.Exception.Message)"
            }
            Start-Sleep -Seconds 3
          }
          if (-not $tunnel) {
            Write-Host "Checking if ngrok process is running..."
            $ngrokProc = Get-Process ngrok -ErrorAction SilentlyContinue
            if ($ngrokProc) {
              Write-Host "Ngrok process found (PID: $($ngrokProc.Id))"
            } else {
              Write-Host "No ngrok process found!"
            }
            throw "Ngrok API not ready after $($maxRetries * 3) seconds"
          }
          Write-Host "NGROK URL: $tunnel"
          Write-Host "Username: lucifer"
          Write-Host "Password: JohnCena?6969"
      - name: Connect Rdp.
        run: cmd /c start.bat
      - name: win10 RDP.
        run: cmd /c loop.bat
